<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토닥쌤과 함께하는 통수시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
/* 파스텔 학급신문: 상단 제호 + 2단 편집(왼쪽 개념면 / 오른쪽 관심면). 목록·기사 화면은 1단 기사면.
   개념마다 고유 파스텔색: 평균=분홍, 중앙값=하늘, 최빈값=민트, 산포도=라벤더 */
:root{
  --bg:#fdf6ee; --paper:#fffbf6; --paper-2:#fff1e4; --card:#ffffff;
  --ink:#3d3550; --ink-2:#776d8c; --rule:#3d3550; --hair:#eee2d6; --line:#f4b6c8;
  --pink:#ffdce6; --sky:#d8ebff; --mint:#d4f2e3; --lav:#e8e0ff; --lemon:#fff2c2; --peach:#ffe2cf;
  --pink-d:#d4567e; --sky-d:#3a78c4; --mint-d:#258f60; --lav-d:#7a5fc8; --lemon-d:#a57b00; --peach-d:#c9662f;
  --accent:var(--pink-d);
  --c-mean:var(--pink-d); --c-median:var(--sky-d); --c-mode:var(--mint-d);
  --c-a:var(--sky-d); --c-b:var(--peach-d);
  --ok:#258f60; --no:#d4567e; --bar:#9cc4f2;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Gaegu","Gowun Dodum",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1928; --paper:#221f31; --paper-2:#2c283d; --card:#2a2639;
    --ink:#f2edfb; --ink-2:#b4abca; --rule:#f2edfb; --hair:#3c3752; --line:#8a4f66;
    --pink:#4a2e3e; --sky:#273a55; --mint:#21443a; --lav:#3a315a; --lemon:#463f25; --peach:#4a3326;
    --pink-d:#ff9fbc; --sky-d:#94c3ff; --mint-d:#80dcb2; --lav-d:#bfaaff; --lemon-d:#f0d072; --peach-d:#ffb68c;
    --ok:#80dcb2; --no:#ff9fbc; --bar:#6e92c6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1928; --paper:#221f31; --paper-2:#2c283d; --card:#2a2639;
  --ink:#f2edfb; --ink-2:#b4abca; --rule:#f2edfb; --hair:#3c3752; --line:#8a4f66;
  --pink:#4a2e3e; --sky:#273a55; --mint:#21443a; --lav:#3a315a; --lemon:#463f25; --peach:#4a3326;
  --pink-d:#ff9fbc; --sky-d:#94c3ff; --mint-d:#80dcb2; --lav-d:#bfaaff; --lemon-d:#f0d072; --peach-d:#ffb68c;
  --ok:#80dcb2; --no:#ff9fbc; --bar:#6e92c6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.sheet{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}

/* 제호 */
.masthead{text-align:center;border-bottom:4px double var(--rule);padding-bottom:10px}
.dateline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--rule);padding-bottom:6px;letter-spacing:.02em}
.title-btn{background:none;border:0;cursor:pointer;padding:0;display:block;margin:14px auto 4px}
.title-btn h1{font-weight:900;font-size:clamp(30px,6.4vw,64px);letter-spacing:-.02em}
.title-btn h1 .pre{display:block;font-size:.34em;font-weight:600;letter-spacing:.12em;color:var(--ink-2);margin-bottom:4px}
.motto{font-size:15px;color:var(--ink-2);font-style:italic}
.nav{display:flex;justify-content:center;gap:4px 18px;flex-wrap:wrap;font-family:var(--f-ui);font-size:14px;margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
.nav button{background:none;border:0;cursor:pointer;padding:2px 4px}
.nav button[aria-current="page"]{font-weight:700;text-decoration:underline;text-underline-offset:4px}

/* 1면 2단 */
.front{display:grid;grid-template-columns:1fr 1fr;margin-top:18px}
.col{min-width:0;padding-block:4px 8px}
.col-left{padding-right:24px;border-right:1px solid var(--rule)}
.col-right{padding-left:24px}
.kicker{display:inline-block;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--paper);background:var(--ink);padding:2px 8px;margin-bottom:8px}
.col-head h2{font-size:26px;font-weight:900}
.col-head{border-bottom:2px solid var(--rule);padding-bottom:10px;margin-bottom:14px}
.lead{font-size:16px;color:var(--ink);margin-bottom:16px}
.lead::first-letter{font-size:2.4em;font-weight:900;float:left;line-height:1;padding:4px 6px 0 0;font-family:var(--f-display)}

.concept{padding-block:14px;border-top:1px solid var(--hair)}
.concept:first-of-type{border-top:0}
.concept h3{font-size:22px;font-weight:900;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.concept h3 small{font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.1em}
.concept .def{margin-top:6px}
.formula{font-family:var(--f-ui);font-size:14px;background:var(--paper-2);padding:6px 10px;margin-top:8px;display:inline-block;max-width:100%}
.concept .use{margin-top:8px;font-size:15px;color:var(--ink-2)}
.concept dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.concept dt{font-weight:700}
.concept dd{margin:0}
.more{margin-top:10px;background:none;border:1px solid var(--rule);cursor:pointer;padding:6px 12px;font-family:var(--f-ui);font-size:14px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.more:hover{background:var(--ink);color:var(--paper)}

.fields{list-style:none;margin:0;padding:0}
.fields li+li{border-top:1px solid var(--hair)}
.field-btn{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.field-btn .f-name{font-family:var(--f-display);font-size:21px;font-weight:900}
.field-btn .f-count{font-family:var(--f-ui);font-size:13px;color:var(--ink-2)}
.field-btn .f-desc{grid-column:1/-1;font-size:15px;color:var(--ink-2)}
.field-btn:hover .f-name{text-decoration:underline;text-underline-offset:5px}
.box-note{margin-top:18px;border:1px solid var(--rule);padding:12px 14px;font-size:15px}
.box-note strong{font-family:var(--f-ui)}

/* 기사면(목록, 학습) */
.page{max-width:780px;margin:22px auto 0}
.back{background:none;border:0;cursor:pointer;font-family:var(--f-ui);font-size:14px;padding:4px 0;color:var(--ink-2)}
.back:hover{color:var(--ink);text-decoration:underline}
.page-head{border-bottom:2px solid var(--rule);padding-bottom:12px;margin:8px 0 16px}
.page-head h2{font-size:clamp(24px,4.4vw,34px);font-weight:900}
.byline{font-family:var(--f-ui);font-size:13px;color:var(--ink-2);margin-top:6px}
.recap{background:var(--paper-2);padding:12px 14px;font-size:15px;margin-bottom:16px}

.stories{list-style:none;margin:0;padding:0}
.stories li+li{border-top:1px solid var(--hair)}
.story-btn{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:14px 0;display:grid;gap:4px}
.story-btn h3{font-size:20px;font-weight:700}
.story-btn:hover h3{text-decoration:underline;text-underline-offset:4px}
.story-btn p{font-size:15px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12px}
.tag{border:1px solid var(--ink-2);color:var(--ink-2);padding:0 6px}
.done{background:var(--ok);color:var(--paper);padding:0 6px;font-weight:700}

.story-lead{font-size:17px;margin-bottom:14px}
.focus{border-left:4px solid var(--accent);padding:4px 0 4px 12px;margin-bottom:16px;font-size:15px}
.focus b{font-family:var(--f-ui);color:var(--accent)}

.viz{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:12px;margin-bottom:22px}
.viz-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.viz-top h3{font-size:17px}
.tabs{display:inline-flex;border:1px solid var(--rule);font-family:var(--f-ui);font-size:13px}
.tabs button{background:none;border:0;cursor:pointer;padding:4px 12px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.viz-body{min-width:0}
.tablewrap{overflow-x:auto}
table.data{border-collapse:collapse;font-family:var(--f-ui);font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
table.data th,table.data td{border:1px solid var(--hair);padding:5px 9px;text-align:center;white-space:nowrap}
table.data th{background:var(--paper-2);font-weight:700}
table.data th[scope=row]{text-align:left}
.caption{font-family:var(--f-ui);font-size:12px;color:var(--ink-2);margin-top:8px}
svg.chart{display:block;width:100%;height:auto;font-family:var(--f-ui)}
svg .bar{fill:var(--bar)}
svg .axis{stroke:var(--ink);stroke-width:1}
svg .grid{stroke:var(--hair);stroke-width:1}
svg .lbl{fill:var(--ink-2)}
svg .val{fill:var(--ink);font-weight:700}
svg .m-mean{stroke:var(--c-mean)} svg .t-mean{fill:var(--c-mean)}
svg .m-median{stroke:var(--c-median)} svg .t-median{fill:var(--c-median)}
svg .m-mode{stroke:var(--c-mode)} svg .t-mode{fill:var(--c-mode)}
svg .ga{fill:var(--c-a)} svg .gb{fill:var(--c-b)}
svg .marker{stroke-width:2;stroke-dasharray:6 4;fill:none}
svg .mtext{font-weight:700;font-size:12px;paint-order:stroke;stroke:var(--paper);stroke-width:4px}

/* 문제 */
.qs{display:grid;gap:22px}
.q{min-width:0}
.q h4{font-size:18px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qno{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.08em;border:1px solid var(--rule);padding:0 6px;flex:none}
.hint{font-size:14px;color:var(--ink-2);margin-top:4px}
.fields-row{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px;font-family:var(--f-ui);font-size:14px}
.fields-row label{display:flex;align-items:center;gap:8px}
.inp{font-family:var(--f-ui);font-size:16px;font-variant-numeric:tabular-nums;width:8.5em;padding:6px 8px;border:1px solid var(--ink-2);background:var(--paper);color:var(--ink)}
.inp.sm{width:4.4em;padding:4px 6px;text-align:center;font-size:15px}
.inp.ok{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.inp.no{border-color:var(--no);box-shadow:inset 0 0 0 1px var(--no)}
select.inp{width:auto}
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-family:var(--f-ui);font-size:14px;font-weight:700;padding:6px 14px;cursor:pointer;background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.btn.ghost{background:none;color:var(--ink)}
.btn:hover{opacity:.88}
.fb{font-family:var(--f-ui);font-size:14px;margin-top:8px;min-height:1.2em}
.fb.ok{color:var(--ok);font-weight:700}
.fb.no{color:var(--no)}
.solution{margin-top:8px;background:var(--paper-2);padding:10px 12px;font-family:var(--f-ui);font-size:14px;line-height:1.8;overflow-wrap:anywhere}
.solution .mid{background:var(--ink);color:var(--paper);padding:0 4px}
.note{font-size:15px;background:var(--paper-2);padding:10px 12px}

.choose{border:2px solid var(--rule);padding:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:6px;border:1px solid var(--ink-2);padding:6px 12px;cursor:pointer;font-family:var(--f-ui);font-size:15px}
.opt:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt input{accent-color:var(--accent)}
.reason-l{display:block;font-family:var(--f-ui);font-size:14px;font-weight:700;margin-top:12px}
textarea.inp{width:100%;min-height:90px;resize:vertical;margin-top:6px;line-height:1.6}
.explain{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.explain h5{font-family:var(--f-display);font-size:17px;margin:0 0 6px}
.explain .verdict{font-family:var(--f-ui);font-size:14px;font-weight:700;margin-bottom:8px}
.explain .stats{font-family:var(--f-ui);font-size:14px;margin-top:10px;display:flex;gap:6px 16px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:baseline}

.note-list{list-style:none;margin:0;padding:0}
.note-list li{border-top:1px solid var(--hair);padding:12px 0}
.note-list h3{font-size:18px}
.note-list p{font-size:15px}
.empty{color:var(--ink-2);padding:20px 0}
footer{margin-top:40px;border-top:4px double var(--rule);padding-top:10px;font-family:var(--f-ui);font-size:12px;color:var(--ink-2);text-align:center}

/* 떠 있는 계산기 */
.calc-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;writing-mode:vertical-rl;letter-spacing:.3em;
  font-family:var(--f-ui);font-size:13px;font-weight:700;background:var(--ink);color:var(--paper);border:0;cursor:pointer;
  padding:14px 7px;opacity:.38;transition:opacity .2s;margin-right:env(safe-area-inset-right,0px)}
.calc-tab:hover,.calc-tab:focus-visible,.calc-tab[aria-expanded="true"]{opacity:1}
.calc{position:fixed;right:44px;top:max(80px,calc(50% - 230px));z-index:50;width:264px;background:var(--paper);color:var(--ink);
  border:2px solid var(--rule);box-shadow:0 10px 30px rgba(0,0,0,.18);font-family:var(--f-ui)}
.calc-head{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 12px;background:var(--ink);color:var(--paper);cursor:move;touch-action:none;user-select:none}
.calc-head b{font-size:14px;letter-spacing:.1em}
.calc-head button{background:none;border:0;color:var(--paper);cursor:pointer;font-size:18px;line-height:1;padding:2px 8px}
.calc-screen{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums}
.calc-screen .expr{font-size:13px;color:var(--ink-2);min-height:1.4em;overflow-wrap:anywhere}
.calc-screen .out{font-size:26px;font-weight:700;min-height:1.3em;overflow-wrap:anywhere;line-height:1.3}
.calc-screen .out.err{font-size:15px;color:var(--no)}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border-bottom:1px solid var(--hair)}
.calc-keys button{border:0;background:var(--paper);cursor:pointer;font-size:17px;padding:10px 0;font-variant-numeric:tabular-nums}
.calc-keys button:hover{background:var(--paper-2)}
.calc-keys .op{background:var(--paper-2);font-weight:700}
.calc-keys .eq{background:var(--ink);color:var(--paper);grid-column:span 2;font-weight:700}
.calc-keys .eq:hover{background:var(--ink);opacity:.88}
.calc-keys .fn{font-size:14px;color:var(--ink-2)}
.calc-foot{padding:8px 10px;display:grid;gap:6px}
.calc-foot .btn{width:100%}
.calc-msg{font-size:12px;color:var(--ink-2);min-height:1.2em;margin:0}

@media (max-width:760px){
  .front{grid-template-columns:1fr}
  .col-left{padding-right:0;border-right:0}
  .col-right{padding-left:0;border-top:4px double var(--rule);margin-top:18px;padding-top:16px}
}
@media (max-width:600px){
  .calc{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-width:420px;margin:0 auto}
  .calc-head{cursor:default}
  .calc-keys button{padding:8px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* ===== 파스텔 학급신문 꾸미기 (신문 틀은 그대로, 색·글씨·모서리만 부드럽게) ===== */
body{background-color:var(--bg);background-image:radial-gradient(var(--hair) 1.2px,transparent 1.4px);background-size:22px 22px;font-size:16.5px}
.sheet{background:var(--paper);border-radius:28px;padding:22px clamp(14px,3vw,38px) 26px;box-shadow:0 8px 0 var(--pink),0 18px 40px rgba(122,95,200,.10)}
.title-btn h1,.col-head h2,.concept h3,.page-head h2,.story-btn h3,.q h4,.field-btn .f-name,.explain h5,.note-list h3,.viz-top h3,.kicker,.more,.btn,.nav button,.calc-head b,.calc-tab{font-family:var(--f-display);font-weight:400}

/* 제호 */
.masthead{border-bottom:4px double var(--line)}
.dateline{border-bottom:2px dotted var(--hair);font-size:13px}
.dateline{align-items:flex-start}
.dateline span{background:var(--paper-2);border-radius:999px;padding:1px 10px}
.issue{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-width:0;max-width:100%}
.copyright{font-size:11.5px;color:var(--lav-d);padding-left:4px;line-height:1.4}
.title-btn h1{font-size:clamp(44px,9vw,92px);letter-spacing:.02em;line-height:1.1}
.title-btn h1 .pre{font-family:var(--f-hand);font-weight:700;font-size:.32em;letter-spacing:.04em;color:var(--lav-d)}
.title-btn h1 .ch{display:inline-block;transition:transform .2s}
.title-btn:hover h1 .ch:nth-child(odd){transform:rotate(-4deg)}
.title-btn:hover h1 .ch:nth-child(even){transform:rotate(4deg)}
.ch1{color:var(--pink-d)} .ch2{color:var(--sky-d)} .ch3{color:var(--mint-d)} .ch4{color:var(--lav-d)}
.motto{font-family:var(--f-hand);font-style:normal;font-size:21px;color:var(--ink-2)}
.nav{border-top:0;gap:8px;padding-top:10px}
.nav button{border-radius:999px;padding:4px 16px;background:var(--paper-2);font-size:15px;border:2px solid transparent}
.nav [data-cat="mean"]{background:var(--pink)} .nav [data-cat="median"]{background:var(--sky)}
.nav [data-cat="mode"]{background:var(--mint)} .nav [data-cat="spread"]{background:var(--lav)}
.nav [data-go="note"]{background:var(--lemon)}
.nav button[aria-current="page"]{text-decoration:none;border-color:var(--ink)}
.nav button:hover{transform:translateY(-1px)}

/* 1면 2단 */
.col-left{border-right:2px dashed var(--hair)}
.kicker{border-radius:999px;padding:2px 12px;font-size:14px;letter-spacing:.06em;background:var(--lav);color:var(--lav-d)}
.col-right .kicker{background:var(--mint);color:var(--mint-d)}
.col-head{border-bottom:3px dotted var(--line)}
.col-head h2{font-size:27px}
.lead::first-letter{font-family:var(--f-display);font-weight:400;background:var(--lemon);color:var(--lemon-d);border-radius:14px;padding:6px 9px 2px;margin:4px 8px 0 0}

.concept{--tint:var(--paper-2);--tint-d:var(--ink)}
[data-c="mean"]{--tint:var(--pink);--tint-d:var(--pink-d)}
[data-c="median"]{--tint:var(--sky);--tint-d:var(--sky-d)}
[data-c="mode"]{--tint:var(--mint);--tint-d:var(--mint-d)}
[data-c="spread"]{--tint:var(--lav);--tint-d:var(--lav-d)}
.concept{background:var(--tint);border-radius:20px;padding:16px 18px;border-top:0}
.concept+.concept{margin-top:12px}
.concept h3{color:var(--tint-d);font-size:25px}
.concept .use{color:var(--ink)}
.formula{background:var(--card);border-radius:10px}
.more{border:0;border-radius:999px;background:var(--tint-d);color:var(--paper);font-size:15px;padding:7px 16px}
.more:hover{background:var(--tint-d);color:var(--paper);transform:translateY(-1px)}

/* ================= 통계 계산 ================= */
const sum = a => a.reduce((s,x)=>s+x,0);
const mean = a => sum(a)/a.length;
const sorted = a => [...a].sort((x,y)=>x-y);
function median(a){const s=sorted(a),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function modes(a){
  const m=new Map(); a.forEach(x=>m.set(x,(m.get(x)||0)+1));
  const max=Math.max(...m.values());
  if(max<2) return {list:[],max};
  return {list:[...m].filter(([,v])=>v===max).map(([k])=>k).sort((x,y)=>x-y),max};
}
const variance = a => {const m=mean(a);return mean(a.map(x=>(x-m)**2));};
const r2 = x => Math.round(x*100)/100;
function fmt(x){return r2(x).toLocaleString('ko-KR',{maximumFractionDigits:2});}
function needsRound(x){return Math.abs(x*10-Math.round(x*10))>1e-9;}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fieldName = id => (FIELDS.find(f=>f.id===id)||{}).name||'';
const byId = id => DATA.find(d=>d.id===id);

function parseNum(raw){
  let s=String(raw).trim().replace(/[−–]/g,'-').replace(/루트/g,'√').replace(/[,\s]/g,'').replace(/[^0-9.\-\/√]/g,'');
  if(!s) return NaN;
  if(s.startsWith('√')) return Math.sqrt(parseNum(s.slice(1)));
  if(s.includes('/')){const [a,b]=s.split('/');return Number(a)/Number(b);}
  return Number(s);
}
const close = (x,ans) => Number.isFinite(x) && Math.abs(x-ans) <= 0.05+1e-9;

/* ================= 그래프 (SVG) ================= */
function niceStep(range,count){
  const raw=range/count, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
function barChart({labels,values,ymin=0,unit,xTitle,markers=[],W}){
  const H=Math.round(Math.min(320,Math.max(230,W*0.5)));
  const L=50,R=14,T=26,B=46, pw=W-L-R, ph=H-T-B;
  const top=Math.max(...values,...markers.map(m=>m.v));
  const step=niceStep(top-ymin,4), ymax=Math.ceil(top/step)*step;
  const y=v=>T+ph-(v-ymin)/(ymax-ymin)*ph;
  const n=values.length, bw=pw/n, w=Math.min(bw*0.62,56);
  const fs=Math.max(9,Math.min(12,bw/3.2));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(xTitle)}별 막대그래프">`;
  for(let v=ymin;v<=ymax+1e-9;v+=step){
    s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`;
    s+=`<text class="lbl" x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11">${fmt(v)}</text>`;
  }
  values.forEach((v,i)=>{
    const cx=L+bw*i+bw/2;
    s+=`<rect class="bar" rx="${Math.min(6,w/4)}" x="${cx-w/2}" y="${y(v)}" width="${w}" height="${Math.max(0,y(ymin)-y(v))}"/>`;
    s+=`<text class="val" x="${cx}" y="${y(v)-5}" text-anchor="middle" font-size="${fs}">${fmt(v)}</text>`;
    s+=`<text class="lbl" x="${cx}" y="${T+ph+16}" text-anchor="middle" font-size="${fs}">${esc(labels[i])}</text>`;
  });
  s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(ymin)}" y2="${y(ymin)}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${y(ymin)}"/>`;
  s+=`<text class="lbl" x="${L+pw/2}" y="${H-6}" text-anchor="middle" font-size="12">${esc(xTitle)}</text>`;
  s+=`<text class="lbl" x="${L-6}" y="${T-12}" text-anchor="end" font-size="11">(${esc(unit)})</text>`;
  const pos=[{x:W-R-4,a:'end'},{x:L+6,a:'start'},{x:L+pw/2,a:'middle'}];
  markers.forEach((m,i)=>{
    const yy=y(m.v),p=pos[i%3];
    s+=`<line class="marker m-${m.k}" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/>`;
    s+=`<text class="mtext t-${m.k}" x="${p.x}" y="${yy-6}" text-anchor="${p.a}">${m.t}</text>`;
  });
  return s+'</svg>';
}
function dotPlot({groups,unit,showMeans,W}){
  const all=groups.flatMap(g=>g[1]);
  let lo=Math.floor(Math.min(...all))-1, hi=Math.ceil(Math.max(...all))+1;
  const L=Math.min(110,W*0.26),R=18,T=8,rowH=86,H=T+groups.length*rowH+40, pw=W-L-R;
  let step=[1,2,5,10,20].find(s=>(hi-lo)/s<=Math.max(6,pw/42))||50;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=v=>L+(v-lo)/(hi-lo)*pw;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="두 자료의 점그래프">`;
  groups.forEach(([name,vals],gi)=>{
    const base=T+(gi+1)*rowH-12, cls=gi?'gb':'ga';
    s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>`;
    s+=`<text class="${cls}" x="4" y="${base-30}" font-size="14" font-weight="700">${esc(name)}</text>`;
    if(showMeans){
      const m=mean(vals),sd=Math.sqrt(variance(vals));
      s+=`<text class="lbl" x="4" y="${base-12}" font-size="11">표준편차 ${fmt(sd)}</text>`;
      s+=`<line class="marker m-mean" x1="${x(m)}" x2="${x(m)}" y1="${base-rowH+18}" y2="${base}"/>`;
      s+=`<text class="mtext t-mean" x="${x(m)+5}" y="${base-rowH+28}">평균 ${fmt(m)}</text>`;
    }
    const cnt={};
    vals.forEach(v=>{const k=cnt[v]=(cnt[v]||0)+1;s+=`<circle class="${cls}" cx="${x(v)}" cy="${base-8-(k-1)*15}" r="6.5"/>`;});
  });
  const ay=T+groups.length*rowH+2;
  s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${ay}" y2="${ay}"/>`;
  for(let v=lo;v<=hi+1e-9;v+=step){
    s+=`<line class="axis" x1="${x(v)}" x2="${x(v)}" y1="${ay}" y2="${ay+5}"/><text class="lbl" x="${x(v)}" y="${ay+18}" text-anchor="middle" font-size="11">${fmt(v)}</text>`;
  }
  s+=`<text class="lbl" x="${W-R}" y="${H-4}" text-anchor="end" font-size="11">(${esc(unit)})</text>`;
  return s+'</svg>';
}

function dataTable(d){
  if(d.kind==='cat'){
    return `<div class="tablewrap"><table class="data"><tr><th scope="row">${esc(d.xTitle)}</th>${d.cats.map(c=>`<th>${esc(c[0])}</th>`).join('')}<th>합계</th></tr>
      <tr><th scope="row">수 (${esc(d.unit)})</th>${d.cats.map(c=>`<td>${c[1]}</td>`).join('')}<td>${sum(d.cats.map(c=>c[1]))}</td></tr></table></div>`;
  }
  if(d.kind==='two'){
    return `<div class="tablewrap"><table class="data"><tr><th scope="row">${esc(d.xTitle)}</th>${d.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>
      ${d.groups.map(g=>`<tr><th scope="row">${esc(g[0])} (${esc(d.unit)})</th>${g[1].map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  return `<div class="tablewrap"><table class="data"><tr><th scope="row">${esc(d.xTitle)}</th>${d.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>
    <tr><th scope="row">${esc(d.unit)}</th>${d.values.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr></table></div>`;
}
function chartFor(d,W,reveal){
  if(d.kind==='cat') return barChart({labels:d.cats.map(c=>c[0]),values:d.cats.map(c=>c[1]),unit:d.unit,xTitle:d.xTitle,W});
  if(d.kind==='two') return dotPlot({groups:d.groups,unit:d.unit,showMeans:reveal,W});
  if(d.chart==='freq'){
    const m=new Map(); sorted(d.values).forEach(v=>m.set(v,(m.get(v)||0)+1));
    return barChart({labels:[...m.keys()].map(fmt),values:[...m.values()],unit:d.freqUnit,xTitle:`사이즈 (${d.unit})`,W});
  }
  let markers=[];
  if(reveal){
    markers.push({k:'mean',v:mean(d.values),t:`평균 ${fmt(mean(d.values))}`});
    markers.push({k:'median',v:median(d.values),t:`중앙값 ${fmt(median(d.values))}`});
    const mo=modes(d.values); if(mo.list.length===1) markers.push({k:'mode',v:mo.list[0],t:`최빈값 ${fmt(mo.list[0])}`});
  }
  return barChart({labels:d.labels,values:d.values,ymin:d.ymin||0,unit:d.unit,xTitle:d.xTitle,markers,W});
}

function roundHint(x){return needsRound(x)?' (나누어떨어지지 않으면 반올림하여 소수 첫째 자리까지)':'';}
function qMean(d){
  const a=d.values,m=mean(a);
  return {title:'이 자료의 평균을 구해 보시오.'+roundHint(m), hint:'평균 = (변량의 총합) ÷ (변량의 개수)',
    fields:[{label:'평균',unit:d.unit,ans:m}],
    sol:`(${a.map(fmt).join(' + ')}) ÷ ${a.length}<br>= ${fmt(sum(a))} ÷ ${a.length} = <b>${fmt(m)}${needsRound(m)?' …':''}</b> ${esc(d.unit)}`};
}
function qMedian(d){
  const a=d.values,s=sorted(a),n=s.length,md=median(a);
  const mid=n%2?[(n-1)/2]:[n/2-1,n/2];
  const list=s.map((v,i)=>mid.includes(i)?`<span class="mid">${fmt(v)}</span>`:fmt(v)).join(', ');
  const how=n%2?`변량이 ${n}개(홀수)이므로 ${(n+1)/2}번째 값이 중앙값이에요.`
    :`변량이 ${n}개(짝수)이므로 ${n/2}번째와 ${n/2+1}번째 값의 평균이 중앙값이에요: (${fmt(s[n/2-1])} + ${fmt(s[n/2])}) ÷ 2`;
  return {title:'이 자료의 중앙값을 구해 보시오.', hint:'먼저 작은 값부터 크기순으로 늘어놓아 보세요. 개수가 짝수이면 가운데 두 값의 평균이 중앙값이에요.',
    fields:[{label:'중앙값',unit:d.unit,ans:md}], sol:`크기순: ${list}<br>${how} = <b>${fmt(md)}</b> ${esc(d.unit)}`};
}
function qMode(d){
  const mo=modes(d.values);
  if(mo.list.length===0) return {note:'최빈값: 이 자료는 모든 값이 한 번씩만 나와요. 그래서 최빈값으로는 자료를 대표하기 어려워요.'};
  if(mo.list.length>2) return {note:`최빈값: ${mo.list.map(fmt).join(', ')}이 모두 ${mo.max}번씩 나와 최빈값이 ${mo.list.length}개예요. 최빈값이 이렇게 많으면 대푯값으로 쓰기 어려워요.`};
  const two=mo.list.length===2;
  return {title:two?'이 자료의 최빈값을 모두 구해 보시오. (여러 개면 쉼표로 구분)':'이 자료의 최빈값을 구해 보시오.',
    hint:'가장 많이 나타나는 값을 찾아보세요. 같은 값끼리 묶어 개수를 세어 보면 쉬워요.',
    fields:[{label:'최빈값',unit:d.unit,ans:mo.list,set:true}],
    sol:`${mo.list.map(fmt).join('과 ')}${two?'이 각각':'이'} ${mo.max}번으로 가장 많이 나와요. 최빈값 = <b>${mo.list.map(fmt).join(', ')}</b> ${esc(d.unit)}`};
}
function qCatMode(d){
  const max=Math.max(...d.cats.map(c=>c[1])), top=d.cats.find(c=>c[1]===max)[0];
  return {title:'이 자료의 최빈값을 구해 보시오.', hint:'숫자가 아닌 자료에서는 가장 많이 나타난 항목이 최빈값이에요.',
    fields:[{label:'최빈값',options:d.cats.map(c=>c[0]),ans:top,pick:true}],
    sol:`가장 많은 항목: <b>${esc(top)}</b> (${max}${esc(d.unit)})<br>이 자료는 숫자가 아니라서 평균과 중앙값은 구할 수 없어요.`};
}
function spreadQs(d){
  const G=d.groups.map(([name,v])=>({name,v,m:mean(v),va:variance(v)}));
  return [
    {title:'두 자료의 평균을 각각 구해 보시오.', hint:'평균 = (변량의 총합) ÷ (변량의 개수)',
     fields:G.map(g=>({label:g.name,unit:d.unit,ans:g.m})),
     sol:G.map(g=>`${esc(g.name)}: ${fmt(sum(g.v))} ÷ ${g.v.length} = <b>${fmt(g.m)}</b>`).join('<br>')},
    {title:'각 변량의 편차를 구해 표를 채워 보시오.', hint:'편차 = (변량) − (평균). 편차를 모두 더하면 항상 0이 돼요.',
     dev:G, fields:G.flatMap(g=>g.v.map(v=>({ans:v-g.m}))),
     sol:G.map(g=>`${esc(g.name)}의 편차: ${g.v.map(v=>fmt(v-g.m)).join(', ')} (합 = 0)`).join('<br>')},
    {title:'두 자료의 분산을 각각 구해 보시오.', hint:'분산 = (편차)²의 총합 ÷ (변량의 개수)',
     fields:G.map(g=>({label:g.name,ans:g.va})),
     sol:G.map(g=>`${esc(g.name)}: (편차)² = ${g.v.map(v=>fmt((v-g.m)**2)).join(', ')} → 합 ${fmt(sum(g.v.map(v=>(v-g.m)**2)))} ÷ ${g.v.length} = <b>${fmt(g.va)}</b>`).join('<br>')},
    {title:'두 자료의 표준편차를 각각 구해 보시오.', hint:'표준편차 = √(분산)',
     fields:G.map(g=>({label:g.name,unit:d.unit,ans:Math.sqrt(g.va)})),
     sol:G.map(g=>`${esc(g.name)}: √${fmt(g.va)} = <b>${fmt(Math.sqrt(g.va))}</b> ${esc(d.unit)}`).join('<br>')}
  ];
}
function buildQs(d,route){
  if(d.kind==='two') return spreadQs(d);
  if(d.kind==='cat') return [qCatMode(d)];
  const order=route==='concept'&&d.cat!=='spread'?[d.cat,...['mean','median','mode'].filter(k=>k!==d.cat)]:['mean','median','mode'];
  return order.map(k=>k==='mean'?qMean(d):k==='median'?qMedian(d):qMode(d));
}

        <p class="hint">${isTwo?'앞에서 구한 값을 근거로 골라 보세요.':'앞에서 구한 값들을 비교해 보고, 이 자료의 상황에 가장 알맞은 대푯값을 고르세요.'}</p>

function explainHtml(d,choice){
  const isTwo=d.kind==='two';
  const best=isTwo?d.best:CATS[d.best].name;
  const same=choice===best;
  let stats='';
  if(d.kind==='num'){
    const mo=modes(d.values);
    stats=`<div class="stats"><span><i class="sw" style="background:var(--c-mean)"></i>평균 ${fmt(mean(d.values))}</span><span><i class="sw" style="background:var(--c-median)"></i>중앙값 ${fmt(median(d.values))}</span><span><i class="sw" style="background:var(--c-mode)"></i>최빈값 ${mo.list.length?mo.list.map(fmt).join(', '):'없음'}</span></div>`;
  } else if(isTwo){
    stats=`<div class="stats">${d.groups.map(g=>`<span>${esc(g[0])}: 평균 ${fmt(mean(g[1]))} · 분산 ${fmt(variance(g[1]))} · 표준편차 ${fmt(Math.sqrt(variance(g[1])))}</span>`).join('')}</div>`;
  }
  return `<h5>토닥쌤 해설</h5><p class="verdict">내 선택: ${esc(choice)} · 토닥쌤의 선택: ${esc(best)} — ${same?'같은 선택이에요!':'다른 선택이에요. 해설을 읽고 내 이유와 비교해 보세요.'}</p>
    <p>${esc(d.why)}</p>${stats}`;
}

function checkQ(i){
  const q=cur.qs[i]; let ok=0;
  const fb=document.getElementById('fb'+i);
  // 풀이는 모든 칸에 답을 입력하고 확인을 눌러야 열림
  const empty=q.fields.filter((f,j)=>!document.getElementById(`q${i}f${j}`).value.trim()).length;
  if(empty){fb.className='fb no';fb.textContent=q.fields.length>1?`빈 칸이 ${empty}개 있어요. 모든 칸에 답을 입력해야 풀이를 볼 수 있어요.`:'답을 먼저 입력해 주세요. 답을 입력해야 풀이를 볼 수 있어요.';return;}
  q.fields.forEach((f,j)=>{
    const el=document.getElementById(`q${i}f${j}`); let good;
    if(f.pick) good=el.value===f.ans;
    else if(f.set){const xs=el.value.split(/[,，、]+|\s+/).map(parseNum).filter(Number.isFinite);good=xs.length===f.ans.length&&f.ans.every(a=>xs.some(x=>close(x,a)));}
    else good=close(parseNum(el.value),f.ans);
    el.classList.toggle('ok',good); el.classList.toggle('no',!good); if(good) ok++;
  });
  if(ok===q.fields.length){fb.className='fb ok';fb.textContent='정답이에요! ✓ 아래 풀이로 한 번 더 확인해 보세요.';}
  else{fb.className='fb no';fb.textContent=q.fields.length>2?`${q.fields.length}칸 중 ${ok}칸이 맞았어요. 아래 풀이와 비교해 빨간 칸을 고쳐 보세요.`:'아쉬워요. 아래 풀이와 내 풀이를 비교해 보고 다시 도전해 보세요.';}
  document.getElementById('sol'+i).hidden=false;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go==='home'){stack.length=0;go({name:'home'},false);}
  else if(t.dataset.go==='note') go({name:'note'});
  else if(t.dataset.cat) go({name:'cat',cat:t.dataset.cat});
  else if(t.dataset.field) go({name:'field',field:t.dataset.field});
  else if(t.dataset.learn) go({name:'learn',id:t.dataset.learn,route:view.name==='field'?'field':'concept'});
  else if('back' in t.dataset) back();
  else if(t.dataset.tab){cur.tab=t.dataset.tab;drawViz();}
  else if(t.dataset.check!==undefined) checkQ(+t.dataset.check);
  else if('submit' in t.dataset){
    const pick=document.querySelector('input[name=pick]:checked'), reason=document.getElementById('reason').value.trim(), fb=document.getElementById('fb-choose');
    if(!pick){fb.className='fb no';fb.textContent='먼저 하나를 골라 주세요.';return;}
    if(reason.length<5){fb.className='fb no';fb.textContent='이유를 한 문장 이상 적어 주세요.';return;}
    fb.textContent='';
    NOTE.done[cur.d.id]={choice:pick.value,reason,at:Date.now()}; saveNote(NOTE);
    const ex=document.getElementById('explain'); ex.innerHTML=explainHtml(cur.d,pick.value); ex.hidden=false;
    cur.reveal=true; if(cur.tab==='chart') drawViz(); else {cur.tab='chart';drawViz();}
    ex.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  else if('copy' in t.dataset){
    const txt=noteText(), fb=document.getElementById('fb-note');
    const fallback=()=>{const b=document.getElementById('copybox');b.hidden=false;b.value=txt;b.select();fb.className='fb';fb.textContent='자동 복사가 막혀 있어요. 아래 글이 선택되어 있으니 Ctrl+C(휴대폰은 길게 눌러 복사)로 복사하세요.';};
    try{navigator.clipboard.writeText(txt).then(()=>{fb.className='fb ok';fb.textContent='복사했어요. 과제 제출란에 붙여 넣으세요.';},fallback);}catch(err){fallback();}
  }
  else if('clear' in t.dataset){
    if(t.dataset.armed){NOTE.done={};saveNote(NOTE);render();}
    else{t.dataset.armed='1';t.textContent='정말 비울까요? 한 번 더 누르세요';}
  }
});

(function(){

  const exprEl=document.getElementById('calc-expr'), outEl=document.getElementById('calc-out'), msg=document.getElementById('calc-msg');
  let expr='', ans=0, last=null, justEval=false, lastInput=null;

  // 계산식 해석 (eval 없이): 덧셈·뺄셈 < 곱셈·나눗셈 < 부호 < 제곱(²) < 괄호·√
  function tokenize(s){
    const t=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const n=s.slice(i,j);if((n.match(/\./g)||[]).length>1)throw '소수점이 두 번 들어갔어요';t.push({n:Number(n)});i=j;}
      else if(s.startsWith('Ans',i)){t.push({n:ans});i+=3;}
      else {t.push({o:c});i++;}
    }
    return t;
  }
  function evaluate(s){
    const t=tokenize(s); let p=0;
    const peek=()=>t[p], isO=(x)=>t[p]&&t[p].o===x;
    const startsFactor=()=>t[p]&&(t[p].n!==undefined||t[p].o==='('||t[p].o==='√');
    function expr_(){let v=term();while(isO('+')||isO('−')){const o=t[p++].o,r=term();v=o==='+'?v+r:v-r;}return v;}
    function term(){let v=unary();
      while(true){
        if(isO('×')){p++;v*=unary();}
        else if(isO('÷')){p++;const r=unary();if(r===0)throw '0으로 나눌 수 없어요';v/=r;}
        else if(startsFactor()){v*=unary();}
        else break;
      }return v;}
    function unary(){if(isO('−')){p++;return -unary();}if(isO('+')){p++;return unary();}return post();}
    function post(){let v=prim();while(isO('²')){p++;v=v*v;}return v;}
    function prim(){
      const k=peek(); if(!k) throw '식이 끝나지 않았어요';
      if(k.n!==undefined){p++;return k.n;}
      if(k.o==='('){p++;const v=expr_();if(isO(')'))p++;return v;}
      if(k.o==='√'){p++;const v=post();if(v<0)throw '음수의 제곱근은 구할 수 없어요';return Math.sqrt(v);}
      throw '식을 다시 확인해 주세요';
    }
    const v=expr_(); if(p<t.length) throw '식을 다시 확인해 주세요';
    if(!Number.isFinite(v)) throw '계산할 수 없는 식이에요';
    return v;
  }
  const show=v=>{const r=Math.round(v*1e8)/1e8;return String(r);};
  function paint(){
    exprEl.textContent=justEval?expr+' =':expr;
    outEl.classList.remove('err');
    if(justEval){outEl.textContent=show(last);return;}
    try{outEl.textContent=expr?show(evaluate(expr)):'0';}catch(e){outEl.textContent=expr||'0';}
  }
  function press(k){
    if(k==='C'){expr='';justEval=false;last=null;paint();return;}
    if(k==='back'){if(justEval){justEval=false;}else expr=expr.endsWith('Ans')?expr.slice(0,-3):expr.slice(0,-1);paint();return;}
    if(k==='='){
      if(!expr)return;
      try{last=evaluate(expr);ans=last;justEval=true;paint();}
      catch(e){outEl.textContent=typeof e==='string'?e:'식을 다시 확인해 주세요';outEl.classList.add('err');exprEl.textContent=expr;}
      return;
    }
    if(justEval){ // 계산이 끝난 뒤: 연산자는 직전 답에 이어서, 숫자는 새로 시작
      expr=/^[+−×÷²]$/.test(k)?'Ans'+k:'';
      justEval=false;
      if(/^[+−×÷²]$/.test(k)){paint();return;}
    }
    expr+=k; paint();
  }
  function open(v){
    panel.hidden=!v; tab.setAttribute('aria-expanded',v);
    if(v) panel.querySelector('[data-k="7"]').focus({preventScroll:true});
  }
  tab.addEventListener('click',()=>open(panel.hidden));
  document.getElementById('calc-close').addEventListener('click',()=>{open(false);tab.focus();});
  document.getElementById('calc-keys').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k);});

  // 학생이 마지막으로 누른 답 칸을 기억했다가 결과를 넣어 줌
  const remember=e=>{const el=e.target;if(el.matches&&el.matches('input.inp')&&el.id!=='stname')lastInput=el;};
  document.addEventListener('focusin',remember);
  document.addEventListener('pointerdown',remember);
  document.getElementById('calc-put').addEventListener('click',()=>{
    if(!lastInput||!document.body.contains(lastInput)){msg.textContent='먼저 문제의 답 칸을 한 번 눌러 주세요.';return;}
    let v=justEval?last:null;
    if(v===null){try{v=expr?evaluate(expr):null;}catch(e){v=null;}}
    if(v===null){msg.textContent='먼저 계산을 해 주세요.';return;}
    lastInput.value=String(Math.round(v*100)/100);
    lastInput.focus({preventScroll:true});
    msg.textContent=Number.isInteger(Math.round(v*100)/100)||Math.abs(v*100-Math.round(v*100))<1e-9?'답 칸에 넣었어요. "확인"을 눌러 채점해 보세요.':'소수 둘째 자리까지 넣었어요. 문제에서 말한 자리까지 반올림했는지 확인하세요.';
  });

  // 키보드 입력: 답 칸이나 이유 칸에 쓰는 중이 아닐 때만
  document.addEventListener('keydown',e=>{
    if(panel.hidden) return;
    const tg=e.target; if(tg.matches&&tg.matches('input,textarea,select')) return;
    const map={'*':'×','x':'×','/':'÷','-':'−','+':'+','(':'(',')':')','.':'.','^':'²','r':'√','Enter':'=','=':'=','Backspace':'back','Escape':'esc','Delete':'C'};
    let k=/^[0-9]$/.test(e.key)?e.key:map[e.key];
    if(!k) return;
    e.preventDefault();
    if(k==='esc'){open(false);tab.focus();return;}
    press(k);
  });

  // 머리 부분을 끌어 위치 옮기기 (넓은 화면)
  const head=document.getElementById('calc-head'); let drag=null;
  head.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||window.innerWidth<=600) return;
    const r=panel.getBoundingClientRect(); drag={dx:e.clientX-r.left,dy:e.clientY-r.top}; head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',e=>{
    if(!drag) return;
    const w=panel.offsetWidth,h=panel.offsetHeight;
    const x=Math.min(Math.max(0,e.clientX-drag.dx),window.innerWidth-w), y=Math.min(Math.max(0,e.clientY-drag.dy),window.innerHeight-h);
    panel.style.left=x+'px'; panel.style.top=y+'px'; panel.style.right='auto';
  });
  head.addEventListener('pointerup',()=>{drag=null;});
})();
</script>

</html>
